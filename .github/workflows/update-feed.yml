name: Update feed & deploy app

on:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours (GitHub may start it a little late)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Scrape sources
        env:
          PREVIOUS_FEED_URL: ${{ steps.pages.outputs.base_url }}/data/feed.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional — add these in Settings → Secrets and variables → Actions
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: npm run scrape

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
